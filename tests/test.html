  ] },

window.__LOG__ = [];

// Listeners are shared per path (not per doc() call) — matching real Firestore-like
// semantics, where onSnapshot subscriptions registered through one doc() reference
// still hear writes made through a different doc() call for the same path (e.g. a
// different part of the app, or a simulated "another user", writing concurrently).
window.__LISTENERS__ = window.__LISTENERS__ || {};
function makeDocRef(path){
  window.__LISTENERS__[path] = window.__LISTENERS__[path] || [];
  var listeners = window.__LISTENERS__[path];
  function currentSnap(){
    var data = window.__STORE__[path];
    return {
      exists: data !== undefined,
      data: function(){ return data; }
    };
  }
  return {
    onSnapshot: function(cb, errCb){
      listeners.push(cb);
      setTimeout(function(){ cb(currentSnap()); }, 0);
      return function(){ var i = listeners.indexOf(cb); if (i!==-1) listeners.splice(i,1); };
    },
    get: function(){
      return Promise.resolve(currentSnap());
    },
    set: function(obj){
      window.__LOG__.push({op:"set", path:path, obj: JSON.parse(JSON.stringify(obj))});
      window.__STORE__[path] = obj;
      listeners.forEach(function(cb){ cb(currentSnap()); });
      return Promise.resolve();
    },
    update: function(obj){
      window.__LOG__.push({op:"update", path:path, obj: JSON.parse(JSON.stringify(obj))});
      var cur = window.__STORE__[path] || {};
      var merged = Object.assign({}, cur, obj);
      window.__STORE__[path] = merged;
      listeners.forEach(function(cb){ cb(currentSnap()); });
      return Promise.resolve();
    },
    delete: function(){
      delete window.__STORE__[path];
      listeners.forEach(function(cb){ cb(currentSnap()); });
      return Promise.resolve();
    }
  };
}

window.claude = {
  use: function(name){
    if (name === "db"){
      return Promise.resolve({
        doc: function(path){ return makeDocRef(path); }
      });
    }
    if (name === "user"){
      return Promise.resolve({
        isOwner: function(){ return true; },
        canEdit: function(){ return true; },
        can: function(){ return Promise.resolve(true); }
      });
    }
    return Promise.resolve(null);
  }
};
window.onerror = function(msg, src, line, col, err){
  window.__LOG__.push({op:"error", msg: msg, line: line, col: col, stack: err && err.stack});
};
</script>
