<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cadastro do paciente</title>
<link rel="icon" href="/favicon.png">
<!--
  Página pública do link de cadastro rápido (sem login). Lê o link pelo endereço
  (?t=código), busca os dados do formulário na função intake_form e envia pela
  intake_send (Supabase, chave pública). Tudo o que chega fica "pendente" até a
  clínica revisar no sistema (Cadastros → Pacientes → Revisar cadastro).
-->
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --surface-2:#eef1f4; --ink:#1d2733; --muted:#5f6b78; --line:#d8dee5;
  --accent:#2e7d6b; --accent-ink:#fff; --danger:#c62828; --ok:#2e7d32;
  --ring:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#1a2129; --surface-2:#222b35; --ink:#e7edf3; --muted:#9aa7b4; --line:#2f3a46;
    --danger:#ef6b6b; --ok:#6cc070;
  }
}
:root[data-theme="dark"]{--bg:#11161c; --surface:#1a2129; --surface-2:#222b35; --ink:#e7edf3; --muted:#9aa7b4; --line:#2f3a46; --danger:#ef6b6b; --ok:#6cc070}
*{box-sizing:border-box}
html{accent-color:var(--accent)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.head img{width:48px;height:48px;object-fit:contain}
.head h1{margin:0;font-size:19px;line-height:1.2}
.head .sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.intro{color:var(--muted);font-size:14px;margin:0 0 6px}
.sec{margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--line);color:var(--accent);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.sec:first-of-type{border-top:0;padding-top:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.grid .wide{grid-column:1 / -1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.req{color:var(--danger)}
/* Mesma altura dos campos do sistema: 38px no computador, 44px no celular (letra de 16px no celular: o iPhone não dá zoom). */
:root{--field-h:38px}
input,select,textarea{width:100%;height:var(--field-h);padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
textarea{height:auto;padding:9px 11px}
@media (max-width:760px){ :root{--field-h:44px} input,select,textarea,.pk-btn{font-size:16px!important} }
/* Listas de escolha e calendário no padrão do sistema: botão no lugar do seletor do aparelho; no computador a lista
   abre flutuando embaixo do campo; no celular, numa janela que sobe da parte de baixo da tela. */
.pk-native{display:none!important}
.pk-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:var(--field-h);padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.pk-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pk-btn .pk-ph{color:var(--muted)}
.pk-btn svg{flex:none;color:var(--muted)}
.pk-btn:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.pk-date{display:flex;gap:6px}
.pk-date input{flex:1;min-width:0}
.pk-cal-btn{flex:none;width:var(--field-h);height:var(--field-h);border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pk-pop{position:absolute;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.08);max-height:300px;overflow:auto;min-width:200px}
.pk-opt{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;padding:10px 14px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-opt:last-child{border-bottom:0}
.pk-opt:hover,.pk-opt.kb{background:var(--surface-2)}
.pk-opt.sel{color:var(--accent);font-weight:700}
.pk-filter{position:sticky;top:0;width:100%;height:auto;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--surface-2);padding:10px 14px}
.pk-none{padding:10px 14px;color:var(--muted);font-size:13px}
.pk-bg{position:fixed;inset:0;background:rgba(10,16,15,.45);z-index:60}
.pk-sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);max-height:82dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:pkUp .18s ease-out}
@keyframes pkUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.pk-head{position:relative;flex:none;display:flex;align-items:center;justify-content:center;padding:18px 60px 12px;border-bottom:1px solid var(--line)}
.pk-head::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:2px;background:var(--line)}
.pk-head b{font-size:17px;text-align:center}
.pk-x{position:absolute;right:12px;top:50%;margin-top:-16px;width:36px;height:36px;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink);font-size:15px;cursor:pointer}
.pk-sheet .pk-list{overflow:auto;flex:1 1 auto;min-height:0}
.pk-sheet .pk-opt{min-height:52px;font-size:16px;padding:12px 20px}
.pk-sheet .pk-filter{font-size:16px;padding:12px 20px}
.pk-cal{padding:12px 14px 14px;min-width:280px}
.pk-cal-h{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.pk-cal-h b{flex:1;text-align:center;font-size:15px}
.pk-cal-h button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;width:36px;height:34px;cursor:pointer;font:inherit}
.pk-cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.pk-cal-g .wd{font-size:11px;color:var(--muted);font-weight:700;padding:4px 0}
.pk-cal-g button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;height:36px;border-radius:50%;cursor:pointer}
.pk-cal-g button:hover{background:var(--surface-2)}
.pk-cal-g button.sel{background:var(--accent);color:var(--accent-ink);font-weight:700}
.pk-cal-g button.today{box-shadow:inset 0 0 0 1px var(--accent)}
.pk-sheet .pk-cal-g button{height:44px;font-size:16px}
.pk-cal-h .pk-cal-t{flex:1;width:auto;border:0;background:transparent;font-weight:700;font-size:15px}
.pk-cal-y{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:300px;overflow:auto}
.pk-cal-y button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;height:40px;font:inherit;cursor:pointer}
.pk-cal-y button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.pk-sheet .pk-cal-y{max-height:none}
.pk-cal-f{display:flex;justify-content:flex-end;margin-top:8px}
.pk-clear{border:0;background:transparent;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:6px 8px}
/* Celular: a data abre a janela de seleção (sem teclado), como nos cadastros do sistema. */
@media (max-width:760px){ .pk-date .pk-cal-btn{display:none} .pk-date input{cursor:pointer;caret-color:transparent} }
.pk-btn.bad,.pk-date input.bad{border-color:var(--danger)!important}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.bad{border-color:var(--danger)!important}
.hint{font-size:12px;color:var(--muted)}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px}
.consent input{width:20px;height:20px;min-height:0;margin-top:2px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:16px;cursor:pointer;width:100%;margin-top:18px}
.btn[disabled]{opacity:.6;cursor:default}
.msg{padding:12px 14px;border-radius:10px;font-size:14px;margin-top:12px}
.msg.err{background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger)}
.done{text-align:center;padding:28px 12px}
.done h2{margin:0 0 8px;color:var(--ok)}
.muted{color:var(--muted)}
@media (max-width:560px){.grid{grid-template-columns:1fr}.head h1{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><img id="logo" src="/favicon.png" alt=""><div><h1 id="cName">Cadastro do paciente</h1><div class="sub" id="cSub"></div></div></div>
  <div class="card" id="box"><p class="muted">Carregando…</p></div>
</div>
<script>
(function(){
  var CFG = null, FORM = null, token = new URLSearchParams(location.search).get("t") || "";
  var box = document.getElementById("box");
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
  function digits(s){ return String(s || "").replace(/\D/g, ""); }
  function fmtCpf(v){ var d = digits(v).slice(0, 11); return d.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d{1,2})$/, ".$1-$2"); }
  function fmtPhone(v){ var d = digits(v).slice(0, 11); if (d.length <= 2) return d; if (d.length <= 6) return "(" + d.slice(0, 2) + ") " + d.slice(2); if (d.length <= 10) return "(" + d.slice(0, 2) + ") " + d.slice(2, 6) + "-" + d.slice(6); return "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7); }
  function fmtCep(v){ var d = digits(v).slice(0, 8); return d.length > 5 ? d.slice(0, 5) + "-" + d.slice(5) : d; }
  function isoToBr(v){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ""); return m ? m[3] + "/" + m[2] + "/" + m[1] : (v || ""); }
  function fmtDate(v){ var d = digits(v).slice(0, 8); return d.length > 4 ? d.slice(0, 2) + "/" + d.slice(2, 4) + "/" + d.slice(4) : d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d; }
  // "dd/mm/aaaa" → "aaaa-mm-dd" (vazio = ""; data inválida ou no futuro = null).
  function brToIso(v){
    if (!v) return "";
    var m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v); if (!m) return null;
    var d = new Date(+m[3], +m[2] - 1, +m[1]);
    if (d.getFullYear() !== +m[3] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[1] || d > new Date() || +m[3] < 1900) return null;
    return m[3] + "-" + m[2] + "-" + m[1];
  }
  // ---- Listas de escolha e calendário (padrão do sistema) ----
  var CHEV = '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M2 3.5h6L5 7z"/></svg>';
  function isPhone(){ return window.matchMedia("(max-width:760px)").matches; }
  function pkClose(){ ["pkPop", "pkBg", "pkSheet"].forEach(function(id){ var e = document.getElementById(id); if (e) e.remove(); }); document.removeEventListener("mousedown", pkOutside, true); document.removeEventListener("keydown", pkKey, true); }
  function pkOutside(e){ var p = document.getElementById("pkPop"); if (p && !p.contains(e.target) && !(p.__btn && p.__btn.contains(e.target))) pkClose(); }
  function pkKey(e){
    if (e.key === "Escape"){ e.preventDefault(); var p = document.getElementById("pkPop") || document.getElementById("pkSheet"), b = p && p.__btn; pkClose(); if (b) b.focus(); return; }
    var host = document.getElementById("pkPop") || document.getElementById("pkSheet"); if (!host) return;
    var opts = Array.prototype.filter.call(host.querySelectorAll(".pk-opt"), function(o){ return !o.hidden; }); if (!opts.length) return;
    var i = opts.indexOf(host.querySelector(".pk-opt.kb"));
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); if (i >= 0) opts[i].classList.remove("kb"); i = e.key === "ArrowDown" ? Math.min(opts.length - 1, i + 1) : Math.max(0, i - 1); opts[i].classList.add("kb"); opts[i].scrollIntoView({block: "nearest"}); }
    if (e.key === "Enter" && i >= 0){ e.preventDefault(); opts[i].click(); }
  }
  // Abre o conteúdo junto do campo (computador) ou na janela de baixo (celular).
  function pkOpen(btn, title, html, wire){
    pkClose();
    var host;
    if (isPhone()){
      var bg = document.createElement("div"); bg.className = "pk-bg"; bg.id = "pkBg"; bg.addEventListener("click", pkClose); document.body.appendChild(bg);
      host = document.createElement("div"); host.className = "pk-sheet"; host.id = "pkSheet"; host.setAttribute("role", "dialog");
      host.innerHTML = '<div class="pk-head"><b>' + esc(title) + '</b><button type="button" class="pk-x" aria-label="Fechar">✕</button></div><div class="pk-list">' + html + '</div>';
      document.body.appendChild(host);
      host.querySelector(".pk-x").addEventListener("click", pkClose);
    } else {
      host = document.createElement("div"); host.className = "pk-pop"; host.id = "pkPop"; host.innerHTML = html;
      document.body.appendChild(host);
      var r = btn.getBoundingClientRect();
      host.style.minWidth = Math.max(200, r.width) + "px";
      host.style.left = Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - host.offsetWidth - 8) + "px";
      host.style.top = (r.bottom + window.scrollY + 4) + "px";
      document.addEventListener("mousedown", pkOutside, true);
    }
    host.__btn = btn;
    document.addEventListener("keydown", pkKey, true);
    wire(host);
    return host;
  }
  function pkLabel(sel){ var o = sel.options[sel.selectedIndex]; return o && o.value ? o.textContent : ""; }
  function pkPaint(sel){ var b = sel.__btn, t = pkLabel(sel); b.innerHTML = '<span' + (t ? '' : ' class="pk-ph"') + '>' + esc(t || "Selecione…") + '</span>' + CHEV; }
  function pkTitle(el){ var f = el.closest(".field"), l = f && f.querySelector("label"); return l ? l.textContent.replace(/\*\s*$/, "").trim() : ""; }
  function enhanceSelect(sel){
    var b = document.createElement("button"); b.type = "button"; b.className = "pk-btn"; b.setAttribute("aria-haspopup", "listbox");
    sel.classList.add("pk-native"); sel.insertAdjacentElement("afterend", b); sel.__btn = b; pkPaint(sel);
    sel.addEventListener("change", function(){ pkPaint(sel); b.classList.remove("bad"); });
    b.addEventListener("click", function(){
      var opts = Array.prototype.filter.call(sel.options, function(o){ return o.value; });
      var many = opts.length > 6;
      var html = (many ? '<input class="pk-filter" type="text" placeholder="Digite para buscar…" autocomplete="off">' : '') +
        opts.map(function(o){ return '<button type="button" class="pk-opt' + (o.value === sel.value ? ' sel' : '') + '" data-v="' + esc(o.value) + '">' + esc(o.textContent) + '</button>'; }).join("") +
        '<div class="pk-none" hidden>Nenhum item encontrado</div>';
      pkOpen(b, pkTitle(sel), html, function(host){
        host.addEventListener("click", function(e){ var o = e.target.closest(".pk-opt"); if (!o) return; sel.value = o.getAttribute("data-v"); sel.dispatchEvent(new Event("change", {bubbles: true})); pkClose(); b.focus(); });
        var fl = host.querySelector(".pk-filter");
        if (fl){
          fl.addEventListener("input", function(){
            var q = normTxt(fl.value), n = 0;
            host.querySelectorAll(".pk-opt").forEach(function(o){ var ok = normTxt(o.textContent).indexOf(q) !== -1; o.hidden = !ok; o.classList.remove("kb"); if (ok) n++; });
            host.querySelector(".pk-none").hidden = n > 0;
            var f0 = host.querySelector(".pk-opt:not([hidden])"); if (q && f0) f0.classList.add("kb");
          });
          if (!isPhone()) fl.focus();
        }
        var cur = host.querySelector(".pk-opt.sel"); if (cur) cur.scrollIntoView({block: "nearest"});
      });
    });
  }
  function normTxt(s){ return String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase(); }
  var MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  function openCalendar(inp, btn){
    var iso = brToIso(inp.value), d = iso ? new Date(iso + "T12:00") : new Date(), y = d.getFullYear(), m = d.getMonth(), mode = "dias";
    var nowY = new Date().getFullYear();
    function grid(){
      if (mode === "anos"){
        var ys = ""; for (var yy = nowY; yy >= nowY - 100; yy--) ys += '<button type="button" data-y="' + yy + '" class="' + (yy === y ? 'sel' : '') + '">' + yy + '</button>';
        return '<div class="pk-cal"><div class="pk-cal-h"><b>Escolha o ano</b></div><div class="pk-cal-y">' + ys + '</div></div>';
      }
      var first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), today = new Date(), out = "";
      ["D", "S", "T", "Q", "Q", "S", "S"].forEach(function(w){ out += '<div class="wd">' + w + '</div>'; });
      for (var i = 0; i < first; i++) out += '<div></div>';
      for (var dd = 1; dd <= days; dd++){
        var v = y + "-" + ("0" + (m + 1)).slice(-2) + "-" + ("0" + dd).slice(-2), fut = new Date(y, m, dd) > today;
        out += '<button type="button" data-d="' + v + '"' + (fut ? ' disabled style="opacity:.3"' : '') + ' class="' + (v === iso ? 'sel' : '') + (new Date(y, m, dd).toDateString() === today.toDateString() ? ' today' : '') + '">' + dd + '</button>';
      }
      return '<div class="pk-cal"><div class="pk-cal-h"><button type="button" data-nav="-1" aria-label="Mês anterior">‹</button><button type="button" class="pk-cal-t" data-years title="Escolher o ano">' + MESES[m] + ' de ' + y + ' ▾</button><button type="button" data-nav="1" aria-label="Próximo mês">›</button></div><div class="pk-cal-g">' + out + '</div>' +
        '<div class="pk-cal-f"><button type="button" class="pk-clear" data-clear>Limpar</button></div></div>';
    }
    var host = pkOpen(btn, pkTitle(inp), grid(), function(h){
      var body = h.querySelector(".pk-list") || h;
      h.addEventListener("click", function(e){
        var n = e.target.closest("[data-nav]"), dd = e.target.closest("[data-d]"), yb = e.target.closest("[data-y]");
        if (e.target.closest("[data-years]")){ mode = "anos"; body.innerHTML = grid(); var sy = body.querySelector(".pk-cal-y .sel"); if (sy) sy.scrollIntoView({block: "center"}); return; }
        if (yb){ y = +yb.getAttribute("data-y"); mode = "dias"; body.innerHTML = grid(); return; }
        if (n){ var t = new Date(y, m + +n.getAttribute("data-nav"), 1); y = t.getFullYear(); m = t.getMonth(); body.innerHTML = grid(); return; }
        if (e.target.closest("[data-clear]")){ inp.value = ""; pkClose(); return; }
        if (dd && !dd.disabled){ inp.value = isoToBr(dd.getAttribute("data-d")); inp.classList.remove("bad"); pkClose(); if (!isPhone()) inp.focus(); }
      });
    });
    return host;
  }
  function cpfOk(v){
    var d = digits(v); if (d.length !== 11 || /^(\d)\1+$/.test(d)) return false;
    for (var t = 9; t < 11; t++){ var s = 0; for (var i = 0; i < t; i++) s += +d[i] * (t + 1 - i); if (((10 * s) % 11) % 10 !== +d[t]) return false; }
    return true;
  }
  function theme(cor, txt){
    if (!/^#[0-9a-f]{6}$/i.test(cor || "")) return;
    var r = document.documentElement.style; r.setProperty("--accent", cor);
    if (/^#[0-9a-f]{6}$/i.test(txt || "")) r.setProperty("--accent-ink", txt);
    else { var n = parseInt(cor.slice(1), 16), l = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; r.setProperty("--accent-ink", l > 0.6 ? "#1d2733" : "#fff"); }
  }
  function rpc(fn, body){
    var h = {apikey: CFG.supabaseAnonKey, "Content-Type": "application/json"};
    if (!/^sb_/.test(CFG.supabaseAnonKey)) h.Authorization = "Bearer " + CFG.supabaseAnonKey;
    return fetch(CFG.supabaseUrl + "/rest/v1/rpc/" + fn, {method: "POST", headers: h, body: JSON.stringify(body)}).then(function(r){
      return r.json().then(function(j){ if (!r.ok) throw new Error((j && j.message) || "Erro " + r.status); return j; });
    });
  }
  var STOP = {invalido: "Este link de cadastro não existe. Confira o endereço ou peça um novo link à clínica.",
    usado: "Este link já foi usado. Se precisar corrigir alguma informação, peça um novo link à clínica.",
    vencido: "Este link venceu (vale 7 dias). Peça um novo link à clínica.",
    cancelado: "Este link foi cancelado pela clínica. Peça um novo link, se precisar."};
  function stop(msg){ box.innerHTML = '<div class="done"><h2 style="color:var(--ink)">Link indisponível</h2><p class="muted">' + esc(msg) + '</p></div>'; }

  // Campos escolhidos em Campos obrigatórios (Link do paciente / Link geral). Sem configuração,
  // vale o padrão (mesmo LINK_FIELDS do sistema). Nome e telefone sempre obrigatórios.
  var DEFAULT_REQ = {nome: 1, telefone: 1, nascimento: 1, cpf: 1, responsavel: 1};
  var GROUP = {respNome: "responsavel", respParentesco: "responsavel", cep: "endereco", numero: "endereco", rua: "endereco", compl: "endereco", bairro: "endereco", cidade: "endereco", uf: "endereco"};
  var ADDR_REQ = {cep: 1, numero: 1, rua: 1, cidade: 1};
  function cfg(key){
    if (key === "nome" || key === "telefone") return {show: true, req: true};
    var c = (FORM.campos || {})[key];
    return c ? {show: !!c.show || !!c.req, req: !!c.req} : {show: true, req: !!DEFAULT_REQ[key]};
  }
  function shown(id){ return cfg(GROUP[id] || id).show; }
  function required(id){ var g = GROUP[id]; if (g === "endereco") return cfg(g).req && !!ADDR_REQ[id]; return cfg(g || id).req; }
  function f(id, label, opt){
    opt = opt || {};
    if (!shown(id)) return "";
    opt.req = required(id);
    var v = opt.value || "", req = opt.req ? ' <span class="req">*</span>' : "";
    var input = opt.select ? '<select id="' + id + '"' + (opt.req ? ' required' : '') + '><option value="">Selecione…</option>' + opt.select.map(function(o){ return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join("") + '</select>'
      : opt.date ? '<div class="pk-date"><input id="' + id + '" type="text" inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" autocomplete="off"' + (opt.req ? ' required' : '') + ' value="' + esc(isoToBr(v)) + '"><button type="button" class="pk-cal-btn" data-cal="' + id + '" aria-label="Abrir calendário"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button></div>'
      : opt.area ? '<textarea id="' + id + '">' + esc(v) + '</textarea>'
      : '<input id="' + id + '" type="' + (opt.type || "text") + '"' + (opt.attrs || "") + (opt.req ? ' required' : '') + ' value="' + esc(v) + '">';
    return '<div class="field' + (opt.wide ? ' wide' : '') + '"><label for="' + id + '">' + esc(label) + req + '</label>' + input + (opt.hint ? '<span class="hint">' + esc(opt.hint) + '</span>' : '') + '</div>';
  }
  function render(){
    var p = FORM.prefill || {}, c = FORM.clinica || {}, upd = FORM.kind === "atualizacao";
    var convs = (FORM.convenios || []).concat(["Particular", "Outro"]);
    function sec(title, html){ return html.replace(/<div><\/div>/g, "") ? '<div class="sec">' + title + '</div><div class="grid">' + html + '</div>' : ""; }
    var nome = c.nome || "a clínica";
    box.innerHTML =
      '<p class="intro">' + (upd ? "Confira os dados abaixo e corrija o que mudou. " : "Preencha os dados abaixo para o cadastro. ") +
        'Os campos com <span class="req">*</span> são obrigatórios. A clínica confere tudo antes de concluir o cadastro.</p>' +
      '<form id="frm" novalidate>' +
      sec("Paciente",
        f("nome", "Nome completo do paciente", {wide: true, value: p.nome || FORM.nome || "", attrs: ' autocomplete="off"'}) +
        f("nascimento", "Data de nascimento", {date: true, value: p.nascimento}) +
        f("cpf", "CPF do paciente", {value: fmtCpf(p.cpf), attrs: ' inputmode="numeric" placeholder="000.000.000-00"'}) +
        f("sexo", "Sexo", {select: ["Feminino", "Masculino", "Outro"], value: p.sexo})) +
      sec("Responsável",
        f("respNome", "Nome do responsável", {value: p.respNome, attrs: ' autocomplete="name"'}) +
        f("respParentesco", "Parentesco", {select: ["Mãe", "Pai", "Avó", "Avô", "Outro"], value: p.respParentesco}) +
        f("telefone", "Telefone / WhatsApp", {value: fmtPhone(p.telefone || FORM.telefone), attrs: ' inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000"'}) +
        f("email", "E-mail", {type: "email", value: p.email, attrs: ' autocomplete="email"'})) +
      sec("Endereço",
        f("cep", "CEP", {value: fmtCep(p.cep), attrs: ' inputmode="numeric" placeholder="00000-000"', hint: "Preenche rua, bairro e cidade."}) +
        f("numero", "Número", {value: p.numero}) +
        f("rua", "Rua", {value: p.rua, wide: true}) +
        f("compl", "Complemento", {value: p.compl}) + f("bairro", "Bairro", {value: p.bairro}) +
        f("cidade", "Cidade", {value: p.cidade}) + f("uf", "UF", {value: p.uf, attrs: ' maxlength="2"'})) +
      sec("Atendimento",
        f("convenio", "Convênio", {select: convs, value: p.convenio}) +
        f("comoConheceu", "Como conheceu a clínica", {select: FORM.origens || [], value: p.comoConheceu}) +
        f("diagnostico", "Diagnóstico ou suspeita", {value: p.diagnostico, wide: true, hint: "Ex.: autismo (TEA), suspeita de TEA, TDAH…"}) +
        f("laudo", "Tem laudo?", {select: ["Sim", "Não", "Em avaliação"], value: p.laudo}) + (shown("laudo") ? '<div></div>' : '') +
        f("escola", "Escola", {value: p.escola}) +
        f("escolaTurno", "Turno da escola", {select: ["Manhã", "Tarde", "Integral", "Noite"], value: p.escolaTurno}) +
        f("obs", "Observações", {area: true, wide: true, value: p.obs})) +
      '<label class="consent"><input type="checkbox" id="consent"> <span>Autorizo ' + esc(nome) + ' a usar estes dados para o cadastro e o atendimento do paciente, conforme a Lei Geral de Proteção de Dados (LGPD). <span class="req">*</span></span></label>' +
      '<div id="err"></div>' +
      '<button class="btn" type="submit" id="send">Enviar cadastro</button>' +
      '</form>';
    wire();
  }
  function wire(){
    var frm = document.getElementById("frm");
    Array.prototype.forEach.call(frm.querySelectorAll("select"), enhanceSelect);
    Array.prototype.forEach.call(frm.querySelectorAll("[data-cal]"), function(b){
      var inp = document.getElementById(b.getAttribute("data-cal"));
      b.addEventListener("click", function(){ openCalendar(inp, b); });
      // Celular: o campo fica só leitura (sem teclado) e abre a janela do calendário ao tocar.
      function phoneMode(){ if (isPhone()){ inp.readOnly = true; inp.setAttribute("inputmode", "none"); } else { inp.readOnly = false; inp.setAttribute("inputmode", "numeric"); } }
      phoneMode(); window.addEventListener("resize", phoneMode);
      inp.addEventListener("click", function(){ if (isPhone()) openCalendar(inp, inp); });
    });
    frm.addEventListener("input", function(e){
      var t = e.target;
      if (t.id === "cpf") t.value = fmtCpf(t.value);
      if (t.id === "telefone") t.value = fmtPhone(t.value);
      if (t.id === "cep") t.value = fmtCep(t.value);
      if (t.id === "uf") t.value = t.value.toUpperCase();
      if (t.id === "nascimento") t.value = fmtDate(t.value);
      t.classList.remove("bad");
    });
    if (document.getElementById("cep")) document.getElementById("cep").addEventListener("change", function(){
      var d = digits(this.value); if (d.length !== 8) return;
      fetch("https://viacep.com.br/ws/" + d + "/json/").then(function(r){ return r.json(); }).then(function(j){
        if (!j || j.erro) return;
        [["rua", j.logradouro], ["bairro", j.bairro], ["cidade", j.localidade], ["uf", j.uf]].forEach(function(x){ var el = document.getElementById(x[0]); if (el && !el.value && x[1]) el.value = x[1]; });
      }).catch(function(){});
    });
    frm.addEventListener("submit", function(e){
      e.preventDefault();
      var err = document.getElementById("err"), bad = [];
      function val(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; }
      Array.prototype.forEach.call(frm.querySelectorAll("[required]"), function(el){ if (!el.value.trim()) bad.push(el.id); });
      if (val("cpf") && !cpfOk(val("cpf"))) bad.push("cpf");
      var nascIso = brToIso(val("nascimento")); if (nascIso === null) bad.push("nascimento");
      if (val("telefone") && digits(val("telefone")).length < 10) bad.push("telefone");
      if (val("email") && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val("email"))) bad.push("email");
      bad.forEach(function(id){ var el = document.getElementById(id); el.classList.add("bad"); if (el.__btn) el.__btn.classList.add("bad"); });
      var consent = document.getElementById("consent").checked;
      if (bad.length || !consent){
        err.innerHTML = '<div class="msg err">' + (bad.length ? "Confira os campos marcados em vermelho" + (bad.indexOf("cpf") !== -1 && val("cpf") ? " (CPF inválido)" : "") + (nascIso === null ? " (data de nascimento inválida: use dd/mm/aaaa)" : "") + "." : "") + (!consent ? " Marque a autorização para enviar." : "") + '</div>';
        var first = bad.length ? document.getElementById(bad[0]) : document.getElementById("consent"); (first.__btn || first).focus();
        return;
      }
      var data = {consentimento: true};
      ["nome", "nascimento", "sexo", "respNome", "respParentesco", "email", "rua", "numero", "compl", "bairro", "cidade", "uf",
       "convenio", "diagnostico", "laudo", "escola", "escolaTurno", "comoConheceu", "obs"].forEach(function(id){ data[id] = val(id); });
      data.nascimento = nascIso || "";
      data.cpf = digits(val("cpf")); data.telefone = digits(val("telefone")); data.cep = digits(val("cep"));
      var btn = document.getElementById("send"); btn.disabled = true; btn.textContent = "Enviando…"; err.innerHTML = "";
      rpc("intake_send", {p_token: token, p_data: data}).then(function(r){
        if (r && r.ok){ box.innerHTML = '<div class="done"><h2>Cadastro enviado!</h2><p class="muted">Obrigado. A clínica vai conferir os dados e entrar em contato, se precisar.</p></div>'; window.scrollTo(0, 0); return; }
        var m = r && r.motivo;
        if (STOP[m]) { stop(STOP[m]); return; }
        btn.disabled = false; btn.textContent = "Enviar cadastro";
        if (m === "obrigatorio" && r.campos) r.campos.forEach(function(k){ var el = document.getElementById(k === "responsavel" ? "respNome" : k === "endereco" ? "cep" : k); if (el){ el.classList.add("bad"); if (el.__btn) el.__btn.classList.add("bad"); } });
        err.innerHTML = '<div class="msg err">' + (m === "limite" ? "Muitos cadastros enviados agora. Tente de novo em alguns minutos." : "Não foi possível enviar. Confira os campos obrigatórios e tente de novo.") + '</div>';
      }, function(){ btn.disabled = false; btn.textContent = "Enviar cadastro"; err.innerHTML = '<div class="msg err">Sem conexão com a clínica agora. Tente de novo em instantes.</div>'; });
    });
  }
  if (!token){ stop(STOP.invalido); return; }
  fetch("/api/config").then(function(r){ return r.json(); }).then(function(cfg){
    CFG = cfg;
    if (cfg.theme) theme(cfg.theme.corBotoes, cfg.theme.corTexto);
    return rpc("intake_form", {p_token: token});
  }).then(function(j){
    if (!j || !j.ok){ stop(STOP[j && j.motivo] || STOP.invalido); return; }
    FORM = j;
    var c = j.clinica || {};
    if (c.nome){ document.getElementById("cName").textContent = c.nome; document.title = "Cadastro — " + c.nome; }
    document.getElementById("cSub").textContent = j.kind === "atualizacao" ? "Atualização do cadastro" : "Cadastro do paciente";
    if (c.logo) document.getElementById("logo").src = c.logo;
    theme(c.cor, c.corTexto);
    render();
  }).catch(function(){ box.innerHTML = '<div class="msg err">Não foi possível abrir o cadastro agora. Tente de novo em instantes.</div>'; });
})();
</script>
</body>
</html>
